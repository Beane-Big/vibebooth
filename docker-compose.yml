# 平台本体：网关、Docker 代理、PostgreSQL、平台核心、门户、模块安装器。
# 模块不写在这里：每个模块由安装器以独立的 Compose 项目（mod-<id>）启动，接入共享网络 platform，
# 安装、升级、卸载模块都不用重启平台。
name: home-platform

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=platform
      - --entrypoints.web.address=:80
      # 默认 60 秒内要读完整个请求，上传几百 MB 的模块包可能不够。
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=10m
      - --log.level=INFO
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    networks: [default, socket]
    depends_on: [socket-proxy]

  # Traefik 只需要读容器列表；通过代理只开放这一项，不把整个 Docker 交给它。
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      # 部分环境（如未开 IPv6 的 WSL2）监听 IPv6 会启动失败。
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      retries: 10

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - core-data:/data
      # 已安装模块的清单和图标，由安装器写入；平台核心每 5 秒扫描一次。
      - modules-data:/modules:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.core.rule=PathPrefix(`/api/platform/`)
      - traefik.http.services.core.loadbalancer.server.port=8080
      # 所有模块路由都引用这个中间件：先问平台核心是否已登录、能否访问该模块。
      - traefik.http.middlewares.platform-auth.forwardauth.address=http://core:8080/api/platform/auth/verify
      - traefik.http.middlewares.platform-auth.forwardauth.authResponseHeaders=Authorization,X-User-Id,X-User-Roles
      # 平台自己的管理接口（安装器）引用这个中间件：只放行管理员。
      - traefik.http.middlewares.platform-admin.forwardauth.address=http://core:8080/api/platform/auth/verify-admin
      - traefik.http.middlewares.platform-admin.forwardauth.authResponseHeaders=Authorization

  portal:
    build: ./portal
    restart: unless-stopped
    labels:
      - traefik.enable=true
      # 未被任何模块认领的 /api/ 请求应返回 404，而不是门户页面。
      - traefik.http.routers.portal.rule=PathPrefix(`/`) && !PathPrefix(`/api/`)
      - traefik.http.routers.portal.priority=1
      - traefik.http.services.portal.loadbalancer.server.port=80

  installer:
    build:
      context: .
      dockerfile: installer/Dockerfile
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://installer-proxy:2375
    volumes:
      - modules-data:/modules
    networks: [default, installer-socket]
    depends_on: [installer-proxy]
    labels:
      - traefik.enable=true
      # 比 core 的 /api/platform/ 更长，Traefik 会优先匹配这一条。
      - traefik.http.routers.installer.rule=PathPrefix(`/api/platform/installer/`)
      - traefik.http.routers.installer.middlewares=platform-admin@docker
      - traefik.http.services.installer.loadbalancer.server.port=8000

  # 安装器专用的 Docker 代理：要导入镜像、创建容器、网络和卷，所以开放了写操作。
  # 它只连在 installer-socket 网络上，只有安装器能访问；网关仍然用上面的只读代理。
  installer-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    restart: unless-stopped
    environment:
      POST: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [installer-socket]

networks:
  default:
    name: platform
  socket:
    internal: true
  installer-socket:
    internal: true

volumes:
  pgdata:
  core-data:
  modules-data:
