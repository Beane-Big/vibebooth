server {
    listen 80;
    root /usr/share/nginx/html;

    # 单页应用：/apps/family/settings 等路径都返回 index.html。
    location /apps/family/ {
        try_files $uri /apps/family/index.html;
    }

    location /apps/family/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
