# 模块清单：安装器和门户靠它认识这个模块，规则见 docs/module-spec.md。
platform: 1              # 遵循的模块规范版本，见 docs/module-spec.md
id: family               # 全局唯一，必须与目录名一致，也是路径前缀
name: 家庭优化大师
description: 家庭成员积分排行榜，记录每一次加分和减分
icon: icon.svg
version: 0.2.0
services:                # 哪个容器接哪个网址前缀，安装器据此生成网关路由
  frontend: {port: 80}   # 容器 family-frontend → /apps/family/
  backend: {port: 8000}  # 容器 family-backend → /api/family/，健康检查 /api/family/health
requires: [people]       # 要调用人员管理的对外接口，安装前必须先装好它
menus:                   # 模块的页面；管理员在门户“用户”页按人勾选，default 是默认拥有它的角色
  - {id: board, name: 记分板, path: /apps/family/, default: [user]}
  # settings: true 表示同时出现在门户的“设置”页；后端用这个菜单判断谁能清零分数。
  - {id: settings, name: 设置, path: /apps/family/settings/, default: [admin], settings: true}
