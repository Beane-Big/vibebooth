# family 模块的容器。scripts/module pack 按 build 构建镜像，打包时去掉 build、把 ${VERSION} 换成 module.yaml 里的版本号。
# 网络、网关路由标签和 JWKS_URL 由安装器补上，这里不写。
services:
  family-backend:
    image: hp-family-backend:${VERSION}
    build:
      context: ../..
      dockerfile: modules/family/backend/Dockerfile
    environment:
      # 人员名单来自人员管理模块的对外接口，在内部网络里直接调用。
      PEOPLE_URL: http://people-backend:8000
    volumes:
      - family-data:/data

  family-frontend:
    image: hp-family-frontend:${VERSION}
    build: ./frontend

volumes:
  family-data:
