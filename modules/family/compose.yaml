# family 模块的服务定义，由根目录 docker-compose.yml 通过 include 引入。
services:
  family-backend:
    build:
      context: ../..
      dockerfile: modules/family/backend/Dockerfile
    restart: unless-stopped
    environment:
      JWKS_URL: http://core:8080/api/platform/.well-known/jwks.json
      # 人员名单来自人员管理模块的对外接口，在内部网络里直接调用。
      PEOPLE_URL: http://people-backend:8000
    volumes:
      - family-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.family-api.rule=PathPrefix(`/api/family/`)
      - traefik.http.routers.family-api.middlewares=platform-auth@docker
      - traefik.http.services.family-api.loadbalancer.server.port=8000

  family-frontend:
    build: ./frontend
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.family-web.rule=PathPrefix(`/apps/family/`)
      - traefik.http.routers.family-web.middlewares=platform-auth@docker
      - traefik.http.services.family-web.loadbalancer.server.port=80

volumes:
  family-data:
