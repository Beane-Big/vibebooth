# 模块清单：安装器和门户靠它认识这个模块，规则见 docs/module-spec.md。
platform: 1              # 遵循的模块规范版本，见 docs/module-spec.md
id: hello                # 全局唯一，必须与目录名一致，也是路径前缀
name: 你好
description: 示例模块，演示登录态和前后端调用
icon: icon.svg
version: 0.2.0
services:                # 哪个容器接哪个网址前缀，安装器据此生成网关路由
  frontend: {port: 80}   # 容器 hello-frontend → /apps/hello/
  backend: {port: 8000}  # 容器 hello-backend → /api/hello/，健康检查 /api/hello/health
menus:                   # 模块的页面；管理员在门户“用户”页按人勾选，default 是默认拥有它的角色
  - {id: home, name: 你好, path: /apps/hello/, default: [user]}
