# hello 模块的容器。scripts/module pack 按 build 构建镜像，打包时去掉 build、把 ${VERSION} 换成 module.yaml 里的版本号。
# 网络、网关路由标签和 JWKS_URL 由安装器补上，这里不写，写了也会被拒绝；允许的字段见 modules/AGENTS.md。
services:
  hello-backend:
    image: hp-hello-backend:${VERSION}
    build:
      context: ../..
      dockerfile: modules/hello/backend/Dockerfile

  hello-frontend:
    image: hp-hello-frontend:${VERSION}
    build: ./frontend
