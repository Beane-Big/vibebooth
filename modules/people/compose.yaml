# people 模块的容器。scripts/module pack 按 build 构建镜像，打包时去掉 build、把 ${VERSION} 换成 module.yaml 里的版本号。
# 网络、网关路由标签和 JWKS_URL 由安装器补上；网关不转发对外接口 /api/people/ext/，只给其他模块在内部网络里直接调用。
services:
  people-backend:
    image: hp-people-backend:${VERSION}
    build:
      context: ../..
      dockerfile: modules/people/backend/Dockerfile
    volumes:
      - people-data:/data

  people-frontend:
    image: hp-people-frontend:${VERSION}
    build: ./frontend

volumes:
  people-data:
