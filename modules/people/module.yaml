# 模块清单：安装器和门户靠它认识这个模块，规则见 modules/AGENTS.md。
id: people               # 全局唯一，必须与目录名一致，也是路径前缀
name: 人员管理
description: 维护家庭成员等人员信息，供其他应用使用
icon: icon.svg
version: 0.2.0
services:                # 哪个容器接哪个网址前缀，安装器据此生成网关路由
  frontend: {port: 80}   # 容器 people-frontend → /apps/people/
  backend: {port: 8000}  # 容器 people-backend → /api/people/，健康检查 /api/people/health
menus:                   # 模块的页面；管理员在门户“用户”页按人勾选，default 是默认拥有它的角色
  - {id: list, name: 人员, path: /apps/people/, default: [user]}
