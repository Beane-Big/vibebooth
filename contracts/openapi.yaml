openapi: 3.1.0
info:
  title: 平台对外接口
  version: 1.0.0
  description: |
    给模块后端在内部网络里调用，基础地址 http://core:8080。
    网关不转发 /api/platform/ext/，浏览器访问不到。目前不需要令牌。
    平台不再对外公开全量人员名单。模块只保存账号 id（即令牌里的 sub），
    需要读取当前用户的联系人或按已知账号 id 解析头像与称呼时调用这里。
    displayName 按 备注 > 姓名 > 账号 解析（备注仅对 viewer 自己生效）。
paths:
  /api/platform/ext/v1/users/{id}/contacts:
    get:
      summary: 列出某个账号的联系人
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: 当前用户的账号 id（模块令牌里的 sub） }
        - { name: mutual, in: query, required: false, schema: { type: string, enum: ["1", "true"] }, description: 传入 1 或 true 时只返回互为好友的联系人 }
      responses:
        "200":
          description: 联系人列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExtUser" }
  /api/platform/ext/v1/users:
    get:
      summary: 按指定账号 id 批量查询基础展示资料
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string }, description: 逗号分隔的账号 id，单次最多 200 个 }
        - { name: viewer, in: query, required: false, schema: { type: integer }, description: 查看者的账号 id；带上后 displayName 优先使用其给对方写的联系人备注 }
      responses:
        "200":
          description: 用户资料列表，按 id 升序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExtUser" }
  /api/platform/ext/v1/notifications:
    post:
      summary: 向平台用户或管理员发送站内与离线推送通知
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPushRequest"
      responses:
        "200":
          description: 已投递的用户数量
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered: { type: integer }
components:
  schemas:
    ExtUser:
      type: object
      required: [id, username, name, displayName, photo]
      properties:
        id: { type: integer, description: 账号 id，模块只保存它 }
        username: { type: string, description: 账号名 }
        name: { type: string, description: 姓名（可能为空） }
        displayName: { type: string, description: 给人看的称呼：按 备注 > 姓名 > 账号 解析 }
        photo: { type: string, description: 头像，JPEG 的 data URL；没有时为空字符串 }
        mutual: { type: boolean, description: 是否与查询者互为好友 }
    NotificationPushRequest:
      type: object
      required: [target, title]
      properties:
        target:
          type: object
          properties:
            userIds:
              type: array
              items: { type: integer }
              description: 目标账号 id 列表（单次最多 200 个）
            role:
              type: string
              enum: [admin]
              description: 按角色投递（目前支持 admin）
        appId: { type: string, description: 来源模块 id，默认 platform }
        title: { type: string, description: 通知标题（最多 120 字） }
        body: { type: string, description: 通知正文（最多 1000 字） }
        link: { type: string, description: 点击跳转的本站相对路径（以 / 开头） }
        dedupKey: { type: string, description: 防重合并键；5 分钟内相同未读通知会合并更新 }
        urgent: { type: boolean, description: 为 true 且接收者不在线时，触发已启用的外部离线推送通道 }
