server {
    listen 80;
    root /usr/share/nginx/html;

    # 单页应用：/login 等路径都返回 index.html。
    # index.html 每次都向服务器确认是否有新版本，升级门户后不用强制刷新。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
