# 发布平台本体预构建镜像，供一键安装（docker-compose.prebuilt.yml / scripts/install.sh）直接使用，用户端无需本地编译。
# 在 main 上打标签 vX.Y.Z 时触发，也可手动触发发布 latest。
name: platform-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core
            context: .
            file: core/Dockerfile
          - service: portal
            context: ./portal
            file: portal/Dockerfile
          - service: installer
            context: .
            file: installer/Dockerfile
          - service: builder
            context: .
            file: builder/Dockerfile
          - service: build-proxy
            context: ./build-proxy
            file: build-proxy/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: 计算镜像标签
        id: meta
        run: |
          IMAGE="ghcr.io/beane-big/vibebooth-${{ matrix.service }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            echo "tags=${IMAGE}:${VER},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: org.opencontainers.image.source=https://github.com/Beane-Big/vibebooth
